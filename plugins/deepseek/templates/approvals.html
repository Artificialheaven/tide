<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审批中心 · 大肥鱼</title>
<style>
:root{--bg:#0B1018;--panel:#121A28;--line:#1E293B;--text:#E9EFF8;--muted:#8494AB;--accent:#45C4F5;--ok:#3FB950;--bad:#F85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.meta{color:var(--muted);font-size:12px}
pre{background:#0F1724;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:160px;margin:10px 0}
button{border:0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;background:var(--accent);color:#04141F;font-weight:600}
button.no{background:#2A1C1C;color:var(--bad);border:1px solid #4A2323}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.toast{position:fixed;right:20px;bottom:20px;background:#1B2A1B;border:1px solid #2F6F3A;color:#9FE3AC;padding:9px 14px;border-radius:9px;display:none}
a{color:var(--accent);text-decoration:none;font-size:12px}
</style>
<link rel="stylesheet" href="/static/tds/tokens.css">
<link rel="stylesheet" href="/static/tds/legacy.css">
</head>
<body>
<div class="wrap">
  <h1>审批中心</h1>
  <div class="sub">非主人执行风险工具时在这里等待批准。超时按配置 fallback（默认拒绝）。<a href="/deepseek/dashboard">← 回面板</a></div>
  <div id="list"><div class="empty">加载中…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const r = await fetch('/deepseek/api/approvals');
  const d = await r.json();
  const list = document.getElementById('list');
  if(!d.pending || !d.pending.length){ list.innerHTML = '<div class="empty">当前没有待审批请求</div>'; return; }
  list.innerHTML = d.pending.map(p => `
    <div class="card">
      <div class="row">
        <div><b>#${p.id} ${esc(p.tool_key)}</b>
          <div class="meta">群 ${esc(p.gid)} · ${esc(p.actor_name||p.actor_id)} · ${new Date((p.created_at||0)*1000).toLocaleString()}</div>
        </div>
        <div>
          <button onclick="decide(${p.id}, true)">批准</button>
          <button class="no" onclick="decide(${p.id}, false)" style="margin-left:8px">拒绝</button>
        </div>
      </div>
      <pre>${esc(p.args_preview || '')}</pre>
    </div>`).join('');
}
async function decide(id, approved){
  const r = await fetch('/deepseek/api/approvals/decide', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, approved})});
  const d = await r.json();
  if(d.ok){ toast(approved ? '已批准 #' + id : '已拒绝 #' + id); load(); }
  else { toast(d.error || '操作失败'); }
}
let t;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(t); t = setTimeout(()=>el.style.display='none', 2400); }
load();
setInterval(load, 10000);
</script>
</body>
</html>
