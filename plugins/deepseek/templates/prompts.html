<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek 群AI · 系统提示词</title>
<style>
body{background:#1a1d23;color:#d7dae0;font:14px/1.6 "Microsoft YaHei",sans-serif;margin:0}
nav{background:#22262e;padding:10px 20px;border-bottom:1px solid #333}
nav a{color:#7aa2f7;margin-right:16px;text-decoration:none}
.wrap{padding:20px;max-width:900px;margin:auto}
fieldset{border:1px solid #333;border-radius:6px;margin-bottom:16px;padding:12px 16px}
legend{color:#8b93a7;padding:0 6px}
.hint{color:#6b7280;font-size:12px}
button{background:#5e81ac;color:#fff;border:0;border-radius:4px;padding:6px 18px;cursor:pointer}
button.reset{background:#4c566a}
.card{border:1px solid #333;border-radius:6px;padding:12px 14px;margin:10px 0;background:#1f232b}
.card.overridden{border-color:#a3be8c}
.card h4{margin:0 0 4px;font-size:14px}
.card h4 .tag{font-weight:normal;font-size:11px;color:#a3be8c;margin-left:8px}
.tokens{margin:6px 0}
.tokens code{background:#2b313c;color:#e3e0a1;border-radius:3px;padding:1px 6px;margin-right:6px;font-size:12px}
textarea{width:100%;height:150px;box-sizing:border-box;background:#22262e;color:#eceff4;
  border:1px solid #3b4252;border-radius:4px;padding:8px;font:13px/1.5 Consolas,"Microsoft YaHei",monospace}
.row{margin-top:8px;display:flex;align-items:center;gap:12px}
.status{font-size:12px;color:#8b93a7}
.status.ok{color:#a3be8c}.status.err{color:#bf616a}
details{margin-top:6px}
summary{cursor:pointer;color:#7aa2f7;font-size:12px}
pre.default{white-space:pre-wrap;word-break:break-word;background:#181b20;
  border:1px solid #2e3440;border-radius:4px;padding:8px;font-size:12px;color:#8b93a7;
  max-height:260px;overflow:auto}
#topbar{display:flex;align-items:center;gap:14px;margin-bottom:8px}
</style>
</head>
<body>
<nav>
  <a href="/deepseek/dashboard?v={{ PLUGIN_VERSION }}">群开关</a>
  <a href="/deepseek/settings?v={{ PLUGIN_VERSION }}">全局设置</a>
  <a href="/deepseek/mcp?v={{ PLUGIN_VERSION }}">MCP 工具</a>
  <a href="/deepseek/memory?v={{ PLUGIN_VERSION }}">群友记忆</a>
  <a href="/deepseek/runs?v={{ PLUGIN_VERSION }}">后台/轮询</a>
  <a href="/deepseek/prompts?v={{ PLUGIN_VERSION }}">提示词</a>
  <span class="hint" style="float:right">v{{ PLUGIN_VERSION }}</span>
</nav>
<div class="wrap">
<div id="topbar">
  <h2 style="margin:0">系统自动注入提示词</h2>
  <span class="hint" id="loadState"></span>
</div>
<p class="hint">这里是框架每轮自动塞进她上下文的文案。改完立即对后续对话生效（不需要重启）；
留空保存或点「恢复默认」即回到内置文案。带 <code>{占位符}</code> 的条目，占位符由系统替换，
不要删除；其余文字可以自由调整。绿色边框 = 这条已被你覆盖。</p>
<div id="box"><span class="hint">加载中…</span></div>
</div>

<script>
const API = '/deepseek/api/prompts';
let DATA = [];

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function load(){
  document.getElementById('loadState').textContent = '加载中…';
  const r = await fetch(API);
  const j = await r.json();
  if (!j.ok) { document.getElementById('loadState').textContent = '加载失败'; return; }
  DATA = j.items;
  render(j.sections);
  document.getElementById('loadState').textContent =
    '共 ' + j.items.length + ' 条，已覆盖 ' + j.items.filter(x => x.overridden).length + ' 条';
}

function render(sections){
  const box = document.getElementById('box');
  box.innerHTML = '';
  sections.forEach(sec => {
    const items = DATA.filter(x => x.section === sec);
    if (!items.length) return;
    const fs = document.createElement('fieldset');
    fs.innerHTML = '<legend>' + esc(sec) + '</legend>';
    items.forEach(it => fs.appendChild(card(it)));
    box.appendChild(fs);
  });
}

function card(it){
  const d = document.createElement('div');
  d.className = 'card' + (it.overridden ? ' overridden' : '');
  d.id = 'card-' + it.key;
  const tokenHtml = (it.tokens || []).length
    ? '<div class="tokens"><span class="hint">占位符：</span>' +
      it.tokens.map(t => '<code>{' + esc(t) + '}</code>').join('') + '</div>'
    : '';
  const emptyDefault = !(it.current || it.default);
  d.innerHTML =
    '<h4>' + esc(it.label) +
      (it.overridden ? '<span class="tag">● 已覆盖</span>' : '') + '</h4>'
    + (it.hint ? '<div class="hint">' + esc(it.hint) + '</div>' : '')
    + tokenHtml
    + '<textarea id="ta-' + it.key + '"'
    +   (emptyDefault ? ' placeholder="（默认留空：不注入，填写后才生效）"' : '')
    +   '>' + esc(it.current || it.default) + '</textarea>'
    + '<div class="row">'
    +   '<button id="save-' + it.key + '">保存</button>'
    +   '<button class="reset" id="reset-' + it.key + '">恢复默认</button>'
    +   '<span class="status" id="st-' + it.key + '"></span>'
    + '</div>'
    + '<details><summary>查看内置默认文案</summary><pre class="default">'
    + esc(it.default) + '</pre></details>';
  const ta = d.querySelector('#ta-' + it.key);
  const setStatus = (cls, msg) => {
    const st = d.querySelector('#st-' + it.key);
    st.className = 'status ' + cls;
    st.textContent = msg;
  };
  d.querySelector('#save-' + it.key).onclick = async () => {
    setStatus('', '保存中…');
    const content = ta.value;
    // 与默认一致就不存覆盖（等同恢复默认）
    const isDefault = content.trim() === it.default.trim();
    const r = await fetch(API + '/' + it.key, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: isDefault ? '' : content})
    });
    const j = await r.json();
    if (!j.ok) { setStatus('err', j.error || '保存失败'); return; }
    it.current = isDefault ? '' : content;
    it.overridden = !isDefault;
    d.classList.toggle('overridden', it.overridden);
    d.querySelector('h4 .tag')?.remove();
    if (it.overridden) {
      const tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = '● 已覆盖';
      d.querySelector('h4').appendChild(tag);
    }
    setStatus('ok', '已保存' + (isDefault ? '（与默认一致，已恢复默认）' : ''));
    setTimeout(() => setStatus('', ''), 3000);
  };
  d.querySelector('#reset-' + it.key).onclick = async () => {
    if (!confirm('恢复「' + it.label + '」的内置默认文案？已保存的覆盖会被删除。')) return;
    setStatus('', '恢复中…');
    const r = await fetch(API + '/' + it.key, {method: 'DELETE'});
    const j = await r.json();
    if (!j.ok) { setStatus('err', j.error || '失败'); return; }
    it.current = ''; it.overridden = false;
    ta.value = it.default;
    d.classList.remove('overridden');
    d.querySelector('h4 .tag')?.remove();
    setStatus('ok', '已恢复默认');
  };
  return d;
}

load();
</script>
</body>
</html>
